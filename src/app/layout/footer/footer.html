<footer class="footer">
  <div class="footer-container">
    <!-- الجزء الأعلى: الشعار ووصف سريع -->
    <div class="footer-top">
      <div class="footer-brand">
        <h3 class="brand-name"><span>{{hero?.name}}</span></h3>
        <p class="brand-desc">
            {{hero?.desc}}
        </p>
      </div>

      <!-- روابط سريعة للسكشنز -->
      <div class="footer-links">
        @for(item of header?.dataNavbar;track $index){
          <a [routerLink]="item.toLowerCase()" class="nav-link" routerLinkActive="active">{{item}}</a>
        }
      </div>
    </div>

    <div class="footer-divider"></div>

    <!-- الجزء الأسفل: الحقوق وزر الصعود للأعلى -->
    <div class="footer-bottom">
      <p class="copyright">
        © 2026 {{hero?.name}}. All Rights Reserved.
      </p>
      <div class="social-links">
        @for (social of contactText?.socialLinks; track $index) {
            <a [href]="social.url" target="_blank" [attr.aria-label]="social.platform">

                <i [class]="'fab fa-' + social.platform"></i>
            </a>
          }
      </div>
    </div>
  </div>
</footer>
