<section id="hero" class="hero-section">
  <div class="hero-container">
    <!-- المحتوى النصي الأيسر -->
    <div class="hero-content">
      <h2 class="hero-greeting">{{hero?.welcome}}</h2>
      <h1 class="hero-name">{{hero?.name}}</h1>
      <h3 class="hero-title">{{hero?.jobTitle}}</h3>

      <p class="hero-description">
        {{hero?.desc}}
      </p>

      <div class="hero-buttons">
        <a routerLink="/projects" class="btn btn-primary">{{hero?.primaryBtn}}</a>
        <a routerLink="/contact" class="btn btn-outline">{{hero?.secondaryBtn}}</a>
      </div>
    </div>

    <!-- الجزء الأيمن: الصورة مع التأثير الأخضر المضيء -->
    <div class="hero-image-wrapper">
      <div class="image-glow"></div>
      <div class="image-container">
        <!-- استبدل المسار بمسار صورتك داخل مجلد assets -->
        <img [src]="staticURL + hero?.imgURL" [alt]="hero?.name" class="profile-img" />
      </div>
    </div>
  </div>
</section>
